name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint · typecheck · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      # publint and attw catch what caused three patch releases in a row back in
      # 2021, all titled "Package bundle dependencies".
      - name: Validate published package
        run: npm run check:pack

      - run: npm pack --dry-run

  test:
    name: test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The end-to-end tests run the built CLI as a real process.
      - run: npm run build

      - name: Test with coverage
        if: matrix.node == '24'
        run: npm run test:coverage

      - name: Test
        if: matrix.node != '24'
        run: npm test

      # Cheap, and catches exactly what the matrix is for: an API this Node lacks.
      - run: node dist/cli.js --help
