name: Release

# Deliberately manual until 2.0.0 ships. On a push trigger release-please would
# read the breaking changes of the 2.0 rewrite against the 2.0.0 baseline in the
# manifest and propose 3.0.0 before 2.0.0 has been released at all. Switch this
# back to `push: branches: [main]` right after the 2.0.0 release, and set the
# manifest and bootstrap-sha to that release commit at the same time.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag created with GITHUB_TOKEN does not trigger workflows on push: tags,
  # so the publish workflow is called from here directly.
  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      dry-run: false
    permissions:
      contents: read
      id-token: write
    secrets: inherit
